# MINIMAL HACK: 1-line fork of the production gpt-oss-20b LoRA SFT workflow.
#
# This is a NEAR-1:1 CLONE of:
#   /Users/tchen7/MyProjects/atlassian_packages/ml-studio/workflows/src/ai_modeling/
#       nl2cypher/nl2cypher_finetuning_sft_gptoss_20b_lora.yaml
#
# The ONLY changes vs production:
#   1. `name`               → unique to avoid clash with prod-released workflow
#   2. `owner`              → tchen7
#   3. `dataset_name`       → swapped from `nl2cypher_finetuning_..._openaimsg`
#                              to public `HuggingFaceH4/ultrachat_200k`
#                              (so this hack works without internal Spark data access)
#   4. `dataset_type`       → `spark` → `hf` (matches the dataset above)
#   5. `sft_format`         → `alpaca` → `openai_messages` (matches HF data format)
#   6. `max_steps`          → `20` → `15` (slightly shorter for cost)
#
# Everything else (instance_type=h200_141gb_8x, base_model=openai/gpt-oss-20b,
# template=gpt, quantization_bit=4, lora_rank=16, etc.) is verbatim production.
#
# Run:
#   atlas ml workflow validate -d configs/hack_oss_20b_sft.yaml -e staging
#   atlas ml workflow run      -d configs/hack_oss_20b_sft.yaml -e staging --json

name: hack-tony-gpt-oss-20b-sft-v4
use_case: ai_modeling
team: ai_modeling
business_unit: "Central AI"
owner: tchen7
realms:
  - us

variables:
  - name: exp_name
    value: hack_tony_gpt_oss_20b_lora_sft_v4

platforms:
  - name: "default"
    is_default: true
    type: databricks/spark
    runtime: 16.4.x-cpu-ml-scala2.13
    instance_type: r6id.2xlarge
    scaling:
      min: 1
      max: 4
  - name: "fabric"
    is_default: false
    type: ml_fabric
    instance_type: h200_141gb_8x
    scaling:
      min: 1
      max: 1

workflow_type: EXPERIMENTAL

module_tasks:
  # Stage 1: data prep on Databricks. ONLY change vs prod: HF dataset instead of Spark.
  - step_name: stage_1_data
    module: llm_dataset_preparation
    version: ":latestAlpha"
    parameters:
      - name: dataset_group_name
        value: stage_1_data
      - name: datasets_config
        value: |-
          task: sft
          datasets:
            - dataset_name: HuggingFaceH4/ultrachat_200k
              dataset_type: hf
              sft_format: openai_messages
              split: train_sft

  # Stage 2: SFT on 8x H200. VERBATIM clone of prod, only step_name changed.
  - step_name: stage_1_train
    module: llm_ft_with_llama_factory  # mlp_llm_finetune
    version: ":latestAlpha"
    platform_override: "fabric"
    parameters:
      - name: data_uri
        value: step:stage_1_data
      - name: base_model_uri
        value: hf:openai/gpt-oss-20b
      - name: step_name
        value: hack_tony_sft_gpt_oss_20b_v4
      - name: file__training_config.yaml
        value: |-
          ### Model Configuration
          # See available arguments: https://github.com/hiyouga/LLaMA-Factory/blob/main/src/llamafactory/hparams/model_args.py
          cutoff_len: 3000 # Maximum sequence length for training
          quantization_bit: 4
          quantization_method: bitsandbytes

          ### Fine-Tuning Method
          stage: sft
          do_train: true
          finetuning_type: lora
          lora_target: all
          lora_rank: 16
          lora_alpha: 32
          lora_dropout: 0.0

          ### Dataset Processing
          packing: true
          neat_packing: false
          preprocessing_num_workers: 16
          template: gpt

          streaming: false
          plot_loss: true

          ### Advanced Options
          deepspeed: examples/deepspeed/ds_z3_config.json
          gradient_checkpointing: true

          ### Training Arguments
          learning_rate: 1.0e-4
          max_steps: 15  # smoke

          # Model checkpointing
          save_total_limit: 1
          save_only_model: true
          save_steps: 5

          # Logging and Reporting
          logging_steps: 1
          report_to: mlflow

          # Evaluation Settings
          do_eval: true
          eval_steps: 5
          val_size: 50
          per_device_eval_batch_size: 8
          eval_strategy: steps
          metric_for_best_model: eval_loss

          # Training Configuration
          per_device_train_batch_size: 8
          gradient_accumulation_steps: 4
          lr_scheduler_type: cosine
          warmup_ratio: 0.1
          bf16: true

          ### Distributed Training
          ddp_timeout: 180000000
          ddp_find_unused_parameters: false
    depends_on:
      - stage_1_data
