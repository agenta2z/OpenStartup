#
# temporal-pdbs.yaml — PodDisruptionBudgets for the Tier-0 reliability triad.
#
# Closes: helmfile_enhancement_plan/02_FINDINGS_CATALOG.md HF-02
# Applied via: helmfile.yaml postsync hook (added in helmfile-temporal-server.patch)
#
# WHY:
# With replicaCount: 2 (HF-03), Kubernetes can SCHEDULE 2 pods, but a `kubectl drain`
# (for routine node maintenance, AZ rebalance, kops upgrade, etc.) will evict BOTH
# pods at once unless a PodDisruptionBudget exists. PDBs tell k8s: "do NOT voluntarily
# evict more than (replicas - minAvailable) pods at once."
#
# minAvailable: 1 strikes the right tradeoff:
#   - Allows ONE pod down at a time (so node drain still succeeds, just sequentially)
#   - Guarantees at least 1 pod stays up during voluntary disruptions
#   - Operationally invisible during steady state — only kicks in during drains
#
# WHY a separate manifest, not chart values:
# The temporal Helm chart (v0.65.0) does not expose PDB definitions per-role.
# We deliver them as raw manifests applied via postsync hook, mirroring the existing
# pattern (patch-prometheus-config-job.yaml, fix-cassandra-gossip-config-job.yaml).
#
# IDEMPOTENCY:
# `kubectl apply -f` is idempotent. Re-applying produces no change. Removing a PDB
# requires explicit `kubectl delete pdb -n temporal <name>`.

# Frontend — protects the gateway through which all clients enter Temporal
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: temporal-frontend
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: frontend
    helmfile-enhancement-plan/closes: HF-02
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/instance: temporal
      app.kubernetes.io/component: frontend
---
